name: MV Module Tests

on:
  workflow_dispatch:
  # Scheduled execution: 9:00 AM China time (1:00 AM UTC)
  # schedule:
  #   - cron: '0 1 * * *'

jobs:
  build-stylebi:
    uses: ./.github/workflows/build-stylebi.yml
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    needs: build-stylebi
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure DB server is running
        uses: ./.github/actions/ensure-db-server
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings for private repository
        uses: s4u/maven-settings-action@v3.0.0
        with:
          repositories: |
            [
              {
                "id": "gh-stylebi",
                "url": "https://maven.pkg.github.com/inetsoft-technology/stylebi",
                "releases": { "enabled": "true" },
                "snapshots": { "enabled": "true" }
              }
            ]
          servers: |
            [
              {
                "id": "gh-stylebi",
                "username": "${{ secrets.MAVEN_USERNAME }}",
                "password": "${{ secrets.MAVEN_PASSWORD }}"
              }
            ]

      - name: Restore stylebi-enterprise Maven artifacts from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/inetsoft
          key: stylebi-enterprise-${{ needs.build-stylebi.outputs.stylebi-sha }}-community-${{ needs.build-stylebi.outputs.community-sha }}

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Initialize environment
        id: init
        run: |
          ./mvnw clean
          ./mvnw package -pl commons -DskipTests

      - name: Run incrementalmv tests
        # run every profile even when an earlier one failed; a failed profile fails the job
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: |
          # the profiles share the MV storage under mv/target, so each one starts without it
          rm -rf mv/target
          status=0
          ./mvnw test -pl mv -Pincrementalmv -Dinetsoft.license.key="${{ secrets.INETSOFT_LICENSE_KEY }}" || status=$?
          # keep the reports of this profile, the next profile deletes mv/target
          mkdir -p mv-reports/incrementalmv
          for d in surefire-reports spock-reports test-classes/exportedData; do
            [ -d mv/target/$d ] && cp -r mv/target/$d mv-reports/incrementalmv/
          done
          exit $status

      - name: Run topmv tests
        # run every profile even when an earlier one failed; a failed profile fails the job
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: |
          # the profiles share the MV storage under mv/target, so each one starts without it
          rm -rf mv/target
          status=0
          ./mvnw test -pl mv -Ptopmv -Dinetsoft.license.key="${{ secrets.INETSOFT_LICENSE_KEY }}" || status=$?
          # keep the reports of this profile, the next profile deletes mv/target
          mkdir -p mv-reports/topmv
          for d in surefire-reports spock-reports test-classes/exportedData; do
            [ -d mv/target/$d ] && cp -r mv/target/$d mv-reports/topmv/
          done
          exit $status

      - name: Run submv tests
        # run every profile even when an earlier one failed; a failed profile fails the job
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: |
          # the profiles share the MV storage under mv/target, so each one starts without it
          rm -rf mv/target
          status=0
          ./mvnw test -pl mv -Psubmv -Dinetsoft.license.key="${{ secrets.INETSOFT_LICENSE_KEY }}" || status=$?
          # keep the reports of this profile, the next profile deletes mv/target
          mkdir -p mv-reports/submv
          for d in surefire-reports spock-reports test-classes/exportedData; do
            [ -d mv/target/$d ] && cp -r mv/target/$d mv-reports/submv/
          done
          exit $status

      - name: Run vpm tests
        # run every profile even when an earlier one failed; a failed profile fails the job
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: |
          # the profiles share the MV storage under mv/target, so each one starts without it
          rm -rf mv/target
          status=0
          ./mvnw test -pl mv -Pvpm -Dinetsoft.license.key="${{ secrets.INETSOFT_LICENSE_KEY }}" || status=$?
          # keep the reports of this profile, the next profile deletes mv/target
          mkdir -p mv-reports/vpm
          for d in surefire-reports spock-reports test-classes/exportedData; do
            [ -d mv/target/$d ] && cp -r mv/target/$d mv-reports/vpm/
          done
          exit $status

      - name: Run others tests
        # run every profile even when an earlier one failed; a failed profile fails the job
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: |
          # the profiles share the MV storage under mv/target, so each one starts without it
          rm -rf mv/target
          status=0
          ./mvnw test -pl mv -Pothers -Dinetsoft.license.key="${{ secrets.INETSOFT_LICENSE_KEY }}" || status=$?
          # keep the reports of this profile, the next profile deletes mv/target
          mkdir -p mv-reports/others
          for d in surefire-reports spock-reports test-classes/exportedData; do
            [ -d mv/target/$d ] && cp -r mv/target/$d mv-reports/others/
          done
          exit $status

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: MV Maven Tests
          path: 'mv-reports/*/surefire-reports/*.xml'
          reporter: java-junit

      - name: Upload Spock reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-spock-reports
          path: 'mv-reports/*/spock-reports/'
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload exportData directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-exportData
          path: 'mv-reports/*/exportedData/'
          retention-days: 7
          if-no-files-found: ignore

      - name: Show DB server watchdog log
        if: always()
        run: cat "$DB_SERVER_WATCHDOG_LOG" 2>/dev/null || echo "No watchdog log"

      - name: Send DingTalk Notification
        if: always()
        run: |
          TIMESTAMP=$(date +%s000)
          SECRET="${{ secrets.DINGTALK_SECRET }}"
          STRING_TO_SIGN="${TIMESTAMP}\n${SECRET}"
          SIGN=$(printf "$STRING_TO_SIGN" | \
            openssl dgst -sha256 -hmac "$SECRET" -binary | base64)
          SIGN=$(python3 - <<EOF
          import urllib.parse
          print(urllib.parse.quote("${SIGN}"))
          EOF
          )
          
          WEBHOOK="${{ secrets.DINGTALK_WEBHOOK }}&timestamp=${TIMESTAMP}&sign=${SIGN}"
          
          curl -X POST "$WEBHOOK" \
          -H "Content-Type: application/json" \
          -d '{"msgtype": "markdown",
          "markdown": {
            "title": "MV Test Result",
            "text": "# MV Test Result\n- **Status**: ${{ job.status }}\n- **Module**: mv\n- **Run URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }}'