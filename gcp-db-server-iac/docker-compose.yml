version: "3"

services:

  mysql:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-mysql:8.0.12
    ports:
      - "3306:3306"
    restart: unless-stopped

  postgres:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-postgres:11
    ports:
      - "5432:5432"
    restart: unless-stopped

  sqlserver:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-sqlserver:2017
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: "Inetsoft1234"
      ACCEPT_EULA: "Y"
    restart: unless-stopped

  db2:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-db2:10.5
    ports:
      - "50000:50000"
    restart: unless-stopped

  oracle:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-myoracle:xe-11g-r2
    ports:
      - "1521:1521"
    restart: unless-stopped

  informix:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-informix:14.10
    ports:
      - "9088:9088"
    restart: unless-stopped

  derby:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-derby:10.15.2.0
    ports:
      - "1527:1527"
    restart: unless-stopped

  clickhouse:
    image: ghcr.io/bonnieshi43/inetsoft-dbs/inetsoft-dbs-clickhouse:22.1.3.7
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=inetsoft
    restart: unless-stopped
